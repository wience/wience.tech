<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 760 368" role="img" aria-label="The synced row now carries a UUID instead of the image" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a9a"/></marker>
  </defs>
  <rect x="0" y="44" width="760" height="368" rx="6" fill="#ffffff"/>
  <text x="24" y="70" font-size="11.5" font-weight="600" fill="#5f5f5f">Before</text>
  <line x1="24" x2="736" y1="180" y2="180" stroke="#e3e3e3"/>
  <text x="24" y="202" font-size="11.5" font-weight="600" fill="#5f5f5f">After</text>

  <g fill="none" stroke="#9a9a9a" stroke-width="1.25">
    <path d="M224 120H276" marker-end="url(#arrow)"/>
    <path d="M476 120H528" marker-end="url(#arrow)"/>
    <path d="M224 248H276" marker-end="url(#arrow)"/>
    <path d="M476 248H528" marker-end="url(#arrow)"/>
    <path d="M124 284V352H276" marker-end="url(#arrow)"/>
    <path d="M476 352H528" marker-end="url(#arrow)"/>
    <path d="M628 284V316" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect x="24" y="84" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="124" y="108" font-weight="600" fill="#1a1a1a">Image picker</text>
    <text x="124" y="124" font-size="11.5" fill="#5f5f5f">returns a base64 string</text>

    <rect x="276" y="84" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="376" y="108" font-weight="600" fill="#1a1a1a">Schedule row</text>
    <text x="376" y="124" font-size="11.5" fill="#5f5f5f">image = base64 string</text>
    <text x="376" y="140" font-size="11.5" fill="#5f5f5f">220 KB avg, 2.6 MB max</text>

    <rect x="528" y="84" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="628" y="108" font-weight="600" fill="#1a1a1a">Every device</text>
    <text x="628" y="124" font-size="11.5" fill="#5f5f5f">PowerSync copies the</text>
    <text x="628" y="140" font-size="11.5" fill="#5f5f5f">full image into SQLite</text>

    <rect x="24" y="212" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="124" y="236" font-weight="600" fill="#1a1a1a">Image picker</text>
    <text x="124" y="252" font-size="11.5" fill="#5f5f5f">saves a local file</text>
    <text x="124" y="268" font-size="11.5" fill="#5f5f5f">and returns its UUID</text>

    <rect x="276" y="212" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="376" y="236" font-weight="600" fill="#1a1a1a">Attachment queue</text>
    <text x="376" y="252" font-size="11.5" fill="#5f5f5f">uploads the file</text>
    <text x="376" y="268" font-size="11.5" fill="#5f5f5f">in the background</text>

    <rect x="528" y="212" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="628" y="236" font-weight="600" fill="#1a1a1a">Supabase Storage</text>
    <text x="628" y="252" font-size="11.5" fill="#5f5f5f">one file per image</text>

    <rect x="276" y="316" width="200" height="72" rx="8" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2"/>
    <text x="376" y="340" font-weight="600" fill="#1a1a1a">Schedule row</text>
    <text x="376" y="356" font-size="11.5" fill="#1a1a1a">image_id = UUID</text>
    <text x="376" y="372" font-size="11.5" fill="#1a1a1a">36 characters, not 220 KB</text>

    <rect x="528" y="316" width="200" height="72" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
    <text x="628" y="340" font-weight="600" fill="#1a1a1a">Every device</text>
    <text x="628" y="356" font-size="11.5" fill="#5f5f5f">syncs the UUID, then</text>
    <text x="628" y="372" font-size="11.5" fill="#5f5f5f">fetches the file</text>

    <text x="502" y="112" font-size="11.5" fill="#5f5f5f">sync</text>
    <text x="502" y="240" font-size="11.5" fill="#5f5f5f">upload</text>
    <text x="200" y="344" font-size="11.5" fill="#5f5f5f">UUID</text>
    <text x="502" y="344" font-size="11.5" fill="#5f5f5f">sync</text>
  </g>
  <text x="638" y="304" font-size="11.5" fill="#5f5f5f">download</text>
</svg>
